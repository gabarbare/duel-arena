
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duel Arena</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;background:#222}
#ov{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);text-align:center;padding:10px;box-sizing:border-box}

/* Amélioration de l'écran de sélection */
#ov.select{
	justify-content:flex-start;
	padding:14px 12px;
	overflow-y:auto;
}
#ov.select .cards{
	display:grid;
	grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
	gap:8px;
	width:min(100%,780px);
	max-height:285px;
	overflow-y:auto;
	align-content:start;
	padding:4px;
	box-sizing:border-box;
}
#ov.select .card{
	width:auto;
	min-width:0;
	font-size:12px;
}
@media(max-width:600px){
	#ov.select{
		padding:8px 6px;
		gap:6px;
	}
	#ov.select .cards{
		grid-template-columns:repeat(auto-fit,minmax(115px,1fr));
		max-height:260px;
	}
	#ov.select .card{
		font-size:11px;
	}
}

button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}
button{background:#3498db;color:#fff;cursor:pointer}
input{text-transform:uppercase;width:90px;text-align:center}
.cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card{background:#222;border:3px solid #444;border-radius:10px;padding:6px;width:92px;cursor:pointer;font-size:11px;text-align:left;line-height:1.5}
.card.sel{background:#444}
#ov.end{background:rgba(0,0,0,.4);justify-content:flex-end;padding-bottom:24px}
.card.lock{opacity:.45}
.chip{display:inline-block;margin:3px 2px 0 0;padding:1px 7px;border-radius:9px;background:#555;font-size:11px}
.chip.on{background:#3498db}
button:disabled{opacity:.4;cursor:default}
/* Contrôles tactiles : visibles uniquement sur mobile / tablette, et seulement pendant un combat */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#touch{display:none;position:absolute;left:0;right:0;bottom:0;padding:0 10px 10px;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5;user-select:none;-webkit-user-select:none;touch-action:none}
#touch button,#tmenu button{pointer-events:auto;touch-action:none;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:bold;width:clamp(46px,9vw,68px);height:clamp(46px,9vw,68px);padding:0;margin:3px;-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(52,152,219,.7)}
#touch .pad{display:flex;flex-direction:column;align-items:center}
#touch .row{display:flex}
#touch .acts{display:grid;grid-template-columns:auto auto}
#touch .ult{background:rgba(241,196,15,.45)}
#tmenu{display:none;position:absolute;top:4px;right:6px;z-index:5}
#tmenu button{width:40px;height:40px;font-size:18px}
#rot{display:none;position:absolute;top:0;left:0;right:0;background:#e67e22;color:#fff;text-align:center;padding:5px;font-size:13px;z-index:6}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){#wrap{width:auto}canvas{width:auto;height:auto;max-width:100vw;max-height:100vh}}
</style>
</head>
<body>
<div id="wrap">
	<div id="rot">📱 Tourne ton téléphone en mode paysage pour mieux jouer</div>
	<canvas id="c" width="900" height="600"></canvas>
	<div id="ov"></div>
	<div id="touch">
		<div class="pad"><button data-k="u">▲</button><div class="row"><button data-k="l">◀</button><button data-k="d">▼</button><button data-k="r">▶</button></div></div>
		<div class="acts"><button data-k="0">J</button><button data-k="1">K</button><button data-k="2">L</button><button data-k="3" class="ult">U</button></div>
	</div>
	<div id="tmenu"><button id="tr">↺</button><button id="tq">✕</button></div>
</div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), ov = document.getElementById('ov');
let ws, me = -1, chars = [], S = null, code = '', err = '', last = '';
const keys = {};

// ====== CATALOGUE de la boutique (4 articles au hasard par jour et par joueur ; pour en ajouter, copie une ligne) ======
// type 'skin' : change les couleurs d'un perso ('pal' = { couleur d'origine : nouvelle couleur })
// type 'char' : verrouille un perso tant qu'il n'est pas acheté
const SHOP = [
  { id: 'perso_luffy', type: 'char', char: 'Luffy', name: 'Luffy', price: 200, desc: 'One Piece : coups élastiques, Gear Second' },
  { id: 'perso_naruto', type: 'char', char: 'Naruto', name: 'Naruto', price: 200, desc: 'Naruto : clones, Rasengan, Rasenshuriken' },
  { id: 'perso_gojo', type: 'char', char: 'Gojo', name: 'Gojo Satoru', price: 300, desc: 'Jujutsu Kaisen : sphères Rouge et Bleu, soin, Infini' },
  { id: 'perso_deku', type: 'char', char: 'Deku', name: 'Izuku Midoriya', price: 250, desc: 'My Hero Academia : One For All, Air Force, Detroit Smash' },
  { id: 'perso_denji', type: 'char', char: 'Denji', name: 'Denji', price: 300, desc: 'Chainsaw Man : Pochita, recul, transformation' },
  { id: 'perso_yugo', type: 'char', char: 'Yugo', name: 'Yugo', price: 300, desc: 'Wakfu : gros laser, portail, épée, forme laser' },
  { id: 'perso_shinra', type: 'char', char: 'Shinra', name: 'Shinra', price: 400, desc: 'Fire Force : vol, coup de pied à visée auto, explosions, Pas du Diable' },
  { id: 'perso_eren', type: 'char', char: 'Eren', name: 'Eren Yeager', price: 400, desc: "L'Attaque des Titans : grappins, Titan Assaillant" },
  { id: 'perso_koro', type: 'char', char: 'Koro', name: 'Koro-sensei', price: 200, desc: 'Assassination Classroom : tentacules, Mach 20' },
  { id: 'perso_kairos', type: 'char', char: 'Kairos', name: 'Kairos', price: 350, desc: 'Perso original : écho temporel, rembobinage, arrêt du temps' },
  { id: 'skin_kaze_or', type: 'skin', char: 'Kaze', name: 'Kaze doré', price: 60, pal: { '#1c1c28': '#c9a227', '#2ecc71': '#fff4c2' } },
  { id: 'skin_bruno_bleu', type: 'skin', char: 'Bruno', name: 'Bruno bleu', price: 60, pal: { '#e74c3c': '#3498db', '#ff7675': '#74b9ff' } },
  { id: 'skin_zephyr_blanc', type: 'skin', char: 'Zéphyr', name: 'Zéphyr blanc', price: 60, pal: { '#6c3483': '#f2f4f6', '#5b2c6f': '#dfe6e9', '#4a235a': '#b2bec3', '#ecf0f1': '#b0b8bf' } },
  { id: 'skin_chevalier_noir', type: 'skin', char: 'Chevalier', name: 'Chevalier noir', price: 60, pal: { '#b0bec5': '#2b2b33', '#cfd8dc': '#454550', '#78909c': '#1c1c24', '#455a64': '#111118', '#90a4ae': '#55555f', '#2c5fa8': '#22222b' } },
  { id: 'skin_viking_rouge', type: 'skin', char: 'Viking', name: 'Viking rouge', price: 60, pal: { '#6d4c41': '#c0392b', '#4e342e': '#7b241c', '#d35400': '#e67e22', '#3e2723': '#4a1410' } },
  { id: 'skin_gojo_lunettes', type: 'skin', char: 'Gojo', name: 'Gojo lunettes (saison 2)', price: 100, look: 'glasses', pal: {} },
  { id: 'skin_luffy_gear4', type: 'skin', char: 'Luffy', name: 'Luffy Gear 4 Snakeman', price: 120, pal: { '#f5cba7': '#2d2d36', '#e74c3c': '#2d2d36', '#3b6fd8': '#c0392b', '#c0392b': '#fff' } },
  { id: 'skin_deku_dark', type: 'skin', char: 'Deku', name: 'Dark Deku', price: 100, pal: { '#2e7d32': '#17171f', '#1b5e20': '#0b0b11', '#c0392b': '#8e1b2f', '#b0bec5': '#3a3a46', '#fff': '#ff3b3b', '#d5dbdb': '#555' } },
  { id: 'skin_naruto_hermite', type: 'skin', char: 'Naruto', name: 'Naruto Mode Hermite', price: 100, look: 'sage', pal: { '#ff7f27': '#d0451b', '#2c5fa8': '#222', '#2c3e50': '#111' } },
];
let earnedCr = 0, rw = 0, pre = null, kNew = 0;
let save = { coins: 0, crystals: 0, kw: 0, quests: null, daily2: null, owned: [], skin: {}, daily: null, stats: { played: 0, wins: 0, losses: 0, byChar: {} } }, view = 'menu', earned = 0, paid = 0, maps = [], searching = false, infoIdx = null;
if (!save.stats || typeof save.stats !== 'object') save.stats = { played: 0, wins: 0, losses: 0, byChar: {} };
if (!save.stats.byChar || typeof save.stats.byChar !== 'object') save.stats.byChar = {};
save.stats.played = Number(save.stats.played) || 0;
save.stats.wins = Number(save.stats.wins) || 0;
save.stats.losses = Number(save.stats.losses) || 0;
try { Object.assign(save, JSON.parse(localStorage.getItem('duelArena') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('duelArena', JSON.stringify(save)); } catch (e) {} };
const owns = id => save.owned.includes(id);
const locked = name => SHOP.some(q => q.type === 'char' && q.char === name && !owns(q.id));
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function connect(first) {
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => w.send(JSON.stringify(first));
  w.onmessage = e => {
    if (w !== ws) return;
    const m = JSON.parse(e.data);
    if (m.t === 'chars') { chars = m.chars; view = 'training'; ui(); }
    else if (m.t === 'room') { me = m.idx; chars = m.chars; maps = m.maps; code = m.code; searching = false; }
    else if (m.t === 'err') { err = m.m; me = -1; S = null; searching = false; w.close(); }
    else if (m.t === 's') {
      S = m; if (m.p !== 'select') pre = null; if (m.w) { if (m.w[me] > rw) qTrack('rm', 1, m.mp); rw = m.w[me]; }
      if (m.p === 'end' && m.co) {
        if (!paid) {
          paid = 1;
          earned = m.co[me];
          save.coins += earned;
          const charIndex = m.f && m.f[me] ? m.f[me].c : null;
          const charName = charIndex != null && chars[charIndex] ? chars[charIndex].name : 'Inconnu';
          const won = Number(m.co[me]) > Number(m.co[1 - me]);
          save.stats.played++;
          if (won) save.stats.wins++; else save.stats.losses++;
          if (!save.stats.byChar[charName]) save.stats.byChar[charName] = { played: 0, wins: 0, losses: 0 };
          const cs = save.stats.byChar[charName];
          cs.played++;
          if (won) cs.wins++; else cs.losses++;
          earnedCr = won ? 1 : 0; save.crystals += earnedCr;
          qTrack('play', 1); qTrack('char', 1, charName); qTrack('earn', earned); if (won) { qTrack('win', 1); kairosWin(); }
          persist();
        }
      } else { paid = 0; kNew = 0; }
    }
    ui();
  };
  w.onclose = () => { if (w === ws && me >= 0) { err = 'Connexion perdue'; me = -1; S = null; ui(); } };
}
const go = o => { err = ''; connect(o); };
const search = () => { err = ''; searching = true; connect({ t: 'queue' }); ui(); };
function openTraining() {
  view = 'training';
  if (!chars.length || !ws || ws.readyState !== 1) connect({ t: 'training_list' });
  else ui();
}
function startTraining(i) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'train', c: i, sk: save.skin[chars[i].name] || '' }));
}
// clic sur un perso = présélection (on peut changer de skin), puis "Valider" envoie le choix
const pick = i => { infoIdx = i; if (!locked(chars[i].name)) pre = i; ui(); };
const sendPick = i => ws.send(JSON.stringify({ t: 'pick', c: i, sk: save.skin[chars[i].name] || '' }));
const confirmPick = () => { if (pre != null && S && S.p === 'select' && S.sel[me] == null) { sendPick(pre); ui(); } };
function kairosWin() {
  kNew = 0; if (owns('perso_kairos')) return;
  save.kw = (save.kw || 0) + 1;
  if (save.kw >= 8) { save.owned.push('perso_kairos'); kNew = 1; }
  persist();
}
const again = () => ws.send(JSON.stringify({ t: 'again' }));
function leave() { me = -1; S = null; err = ''; view = 'menu'; searching = false; try { ws.close(); } catch (e) {} ui(); }
function info(i) { if (pre == null && infoIdx !== i) { infoIdx = i; ui(); } }
function setSkin(name, id, i) { save.skin[name] = id; persist(); if (S && S.p === 'select' && S.sel[me] === i) sendPick(i); ui(); }

const CR = { perso_luffy: 30, perso_naruto: 30, perso_deku: 30, perso_koro: 50, perso_shinra: 50, perso_eren: 50, perso_gojo: 80, perso_yugo: 80, perso_denji: 80 };
const MAPN = ['Dojo', 'Volcan', 'Ville de nuit', 'Banquise', 'Lune'];
const ALLN = ['Bruno', 'Zéphyr', 'Kaze', 'Viking', 'Chevalier', 'Kairos', 'Luffy', 'Naruto', 'Gojo', 'Deku', 'Denji', 'Yugo', 'Shinra', 'Eren', 'Koro'];
const bank = () => `🪙 ${save.coins} pièces · 💎 ${save.crystals} cristaux`;
const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
// boutique de skins : 3 skins au hasard par jour (pièces), renouvelés à minuit
function dailyIds() {
  const key = dayKey();
  if (!save.daily2 || save.daily2.day !== key) {
    save.daily2 = { day: key, ids: shuf(SHOP.filter(q => q.type === 'skin' && !owns(q.id)).map(q => q.id)).slice(0, 3) }; persist();
  }
  return save.daily2.ids;
}
function buy(id) {
  const q = SHOP.find(z => z.id === id);
  if (!q || q.type !== 'skin' || owns(id) || !dailyIds().includes(id) || save.coins < q.price) return;
  save.coins -= q.price; save.owned.push(id); persist(); ui();
}
function buyChar(id) {
  const p = CR[id];
  if (!p || owns(id) || save.crystals < p) return;
  save.crystals -= p; save.owned.push(id); persist(); ui();
}
// quêtes quotidiennes : rw 'c' = pièces, 'g' = cristaux
function questList() {
  if (!save.quests || save.quests.day !== dayKey()) {
    const av = ALLN.filter(n => !locked(n)), ch = av[Math.random() * av.length | 0], mp = Math.random() * 5 | 0;
    const pool = [
      { type: 'play', goal: 3, text: 'Jouer 3 parties', rw: 'c', n: 25 },
      { type: 'win', goal: 2, text: 'Gagner 2 combats', rw: 'g', n: 2 },
      { type: 'char', param: ch, goal: 2, text: 'Jouer 2 parties avec ' + ch, rw: 'c', n: 30 },
      { type: 'earn', goal: 80, text: 'Gagner 80 pièces en combat', rw: 'g', n: 1 },
      { type: 'rm', param: mp, goal: 1, text: 'Gagner une manche sur la map ' + MAPN[mp], rw: 'g', n: 1 }];
    save.quests = { day: dayKey(), list: shuf(pool).slice(0, 4).map(q => ({ ...q, p: 0, done: 0 })) }; persist();
  }
  return save.quests.list;
}
function qTrack(type, n, param) {
  questList().forEach(q => {
    if (q.done || q.type !== type || (q.param !== undefined && String(q.param) !== String(param))) return;
    q.p = Math.min(q.goal, q.p + n);
    if (q.p >= q.goal) { q.done = 1; if (q.rw === 'g') save.crystals += q.n; else save.coins += q.n; }
  });
  persist();
}
const leftTxt = () => { const l = new Date().setHours(24, 0, 0, 0) - Date.now(); return Math.floor(l / 3600000) + ' h ' + Math.floor(l % 3600000 / 60000) + ' min'; };
const questsHtml = () => `<h2>📜 Quêtes du jour</h2><p>${bank()} · renouvelées à minuit (dans ${leftTxt()})</p><div class="cards">${kCard()}${questList().map(q => `<div class="card" style="width:190px;cursor:default;border-color:${q.done ? '#2ecc71' : '#444'}"><b>${q.text}</b><br>Progression : ${q.p} / ${q.goal}<br>Récompense : ${q.n} ${q.rw === 'g' ? '💎' : '🪙'}<br>${q.done ? '✓ Terminée !' : ''}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;
const shopHtml = () => {
  const items = dailyIds().map(id => SHOP.find(q => q.id === id)).filter(Boolean);
  return `<h2>🎨 Boutique de skins</h2><p>${bank()} · 3 skins par jour, nouvelle sélection à minuit (dans ${leftTxt()})</p>` + (items.length
    ? `<div class="cards">${items.map(q => `<div class="card shopc"><b>${q.name}</b><br>Skin · ${q.char}<br>${owns(q.id) ? '✓ Possédé' : `<button ${save.coins < q.price ? 'disabled' : ''} onclick="buy('${q.id}')">${q.price} 🪙</button>`}</div>`).join('')}</div>`
    : '<p>Tu possèdes déjà tous les skins 🎉</p>') + `<button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;
};
const kCard = () => `<div class="card" style="width:190px;cursor:default;border-color:#d9b84a"><b>⭐ Quête spéciale : Kairos</b><br>Gagner 8 combats<br>${owns('perso_kairos') ? '✓ Débloqué !' : 'Progression : ' + (save.kw || 0) + ' / 8'}</div>`;
const charShopHtml = () => `<h2>💎 Boutique de personnages</h2><p>${bank()} · 1 cristal par combat gagné, plus les quêtes</p><div class="cards">${kCard()}${SHOP.filter(q => q.type === 'char' && CR[q.id]).map(q => `<div class="card shopc"><b>${q.name}</b><br>${q.desc}<br>${owns(q.id) ? '✓ Possédé' : `<button ${save.crystals < CR[q.id] ? 'disabled' : ''} onclick="buyChar('${q.id}')">${CR[q.id]} 💎</button>`}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;

function statsHtml() {
  const s = save.stats;
  const top = Object.entries(s.byChar)
    .sort((a, b) => (b[1].played || 0) - (a[1].played || 0))
    .slice(0, 3);
  const rate = (w, p) => p ? Math.round(w / p * 100) : 0;
  const cards = top.length ? top.map(([name, v], i) => {
    const ch = chars.find(c => c.name === name);
    const color = ch ? ch.color : '#3498db';
    return `<div class="card" style="width:190px;border-color:${color};cursor:default">
      <b style="color:${color}">#${i + 1} ${name}</b><br>
      🎮 Parties : ${v.played || 0}<br>
      🏆 Victoires : ${v.wins || 0}<br>
      ❌ Défaites : ${v.losses || 0}<br>
      📈 Winrate : ${rate(v.wins || 0, v.played || 0)}%
    </div>`;
  }).join('') : '<p>Aucune partie terminée pour le moment. Joue un match pour commencer à remplir tes statistiques !</p>';
  return `<h2>📊 Statistiques</h2>
    <p>Statistiques enregistrées sur cet appareil</p>
    <div class="cards">
      <div class="card" style="width:145px;cursor:default"><b>🎮 Parties jouées</b><br>${s.played}</div>
      <div class="card" style="width:145px;cursor:default"><b>🏆 Victoires</b><br>${s.wins}</div>
      <div class="card" style="width:145px;cursor:default"><b>❌ Défaites</b><br>${s.losses}</div>
      <div class="card" style="width:145px;cursor:default"><b>📈 Winrate global</b><br>${rate(s.wins, s.played)}%</div>
    </div>
    <h3>⭐ Tes 3 personnages les plus joués</h3>
    <div class="cards">${cards}</div>
    <button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;
}
const quitBtn = '<button onclick="leave()" style="background:#7f8c8d">Retour au menu</button>';

function ui() {
  let h = '';
  ov.className = me >= 0 && S && S.p === 'end' ? 'end' : '';
  if (me < 0 && searching) h = `<h2>🔎 Recherche d’un adversaire…</h2><p>Tu seras mis face à un joueur aléatoire.</p>${quitBtn.replace('Retour au menu', 'Annuler')}`;
  else if (me < 0) h = view === 'stats' ? statsHtml() : view === 'training' ? `<h2>🎯 Mode entraînement</h2><p>Choisis librement ton personnage : tous les personnages sont disponibles.</p><div class="cards">${chars.map((ch, i) => `<div class="card" style="border-color:${ch.color}" onclick="startTraining(${i})"><b style="color:${ch.color}">${ch.name}</b><br>${ch.desc}<br>PV : ${ch.hp}<br>${ch.atk.map((a,j) => 'JKLU'[j] + ' : ' + a).join('<br>')}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>` : view === 'shop' ? shopHtml() : view === 'chars' ? charShopHtml() : view === 'quests' ? questsHtml() : `<h1>⚔️ Duel Arena</h1><p>${bank()}</p>${err ? `<p style="color:#f66">${err}</p>` : ''}
    <button onclick="search()" style="background:#e67e22">🎲 Matchmaking (adversaire aléatoire)</button>
    <button onclick="go({t:'create'})">Créer une partie multijoueur</button>
    <button onclick="go({t:'bot'})" style="background:#16a085">🤖 Jouer contre un bot</button>
    <div>ou <input id="cd" maxlength="4" placeholder="CODE" value="${location.hash.slice(1)}"> <button onclick="go({t:'join',code:document.getElementById('cd').value})">Rejoindre</button></div>
    <button onclick="openTraining()" style="background:#16a085">🎯 Mode entraînement</button>
    <button onclick="view='stats';ui()" style="background:#2980b9">📊 Statistiques</button>
    <button onclick="view='quests';ui()" style="background:#c0392b">📜 Quêtes du jour</button>
    <button onclick="view='chars';ui()" style="background:#8e44ad">💎 Boutique persos</button>
    <button onclick="view='shop';ui()" style="background:#8e44ad">🎨 Boutique skins</button>`;
