

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duel Arena</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center}
#wrap{position:relative;width:100%;max-width:min(100vw,200vh)}
canvas{width:100%;display:block;background:#222}
#ov{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);text-align:center;padding:10px;box-sizing:border-box}

/* Sélection des combattants : petites cases carrées avec portrait + nom */
#ov.select{
  justify-content:flex-start;
  padding:12px 10px;
  overflow-y:auto;
  gap:8px;
}
#ov.select .cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(76px,1fr));
  gap:7px;
  width:min(100%,690px);
  max-height:245px;
  overflow-y:auto;
  align-content:start;
  padding:4px;
  box-sizing:border-box;
}
#ov.select .card.sm{
  box-sizing:border-box;
  width:100%;
  min-width:0;
  min-height:78px;
  aspect-ratio:1 / 1;
  padding:6px 3px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  border-width:2px;
  border-radius:9px;
  background:linear-gradient(155deg,#292929,#171717);
  text-align:center;
  line-height:1.1;
  font-size:10px;
  overflow:hidden;
}
#ov.select .card.sm.sel{background:linear-gradient(155deg,#494949,#292929);box-shadow:0 0 0 2px #f1c40f,0 0 12px #f1c40f66}
#ov.select .card.sm .portrait{
  width:39px;height:39px;flex:none;display:block;
  filter:drop-shadow(0 2px 2px #0009);
}
#ov.select .card.sm .char-name{
  display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:800;font-size:10px;
}
#ov.select .card.sm .lock-mark{font-size:9px;line-height:1}
@media(max-width:600px){
  #ov.select{padding:7px 5px;gap:6px}
  #ov.select .cards{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px;max-height:220px}
  #ov.select .card.sm{min-height:70px;padding:4px 2px;font-size:9px}
  #ov.select .card.sm .portrait{width:34px;height:34px}
  #ov.select .card.sm .char-name{font-size:9px}
}

button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}
button{background:#3498db;color:#fff;cursor:pointer}
input{text-transform:uppercase;width:90px;text-align:center}
.cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card{background:#222;border:3px solid #444;border-radius:10px;padding:6px;width:92px;cursor:pointer;font-size:11px;text-align:left;line-height:1.5}
.card.sel{background:#444}
#ov.end{background:rgba(0,0,0,.4);justify-content:flex-end;padding-bottom:24px}

/* Menu principal : boutiques à gauche, combats au centre, infos à droite */
#ov.menu-screen{
  justify-content:flex-start;
  align-items:stretch;
  padding:28px 24px 22px;
  gap:18px;
  overflow-y:auto;
}
.menu-top{
  position:relative;
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.menu-top h1{margin:4px 0 0;font-size:clamp(25px,4vw,36px)}
.menu-currency{
  position:static;
  flex:none;
  align-self:flex-start;
  padding:9px 12px;
  border:1px solid #66552a;
  border-radius:10px;
  background:rgba(30,27,20,.94);
  color:#f7d76a;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.menu-layout{
  width:100%;
  max-width:850px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(145px,1fr) minmax(270px,1.65fr) minmax(145px,1fr);
  gap:14px;
  align-items:stretch;
}
.menu-group{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
  padding:14px 10px;
  border:1px solid #444;
  border-radius:14px;
  background:rgba(24,24,24,.88);
}
.menu-group h2{
  margin:0 0 5px;
  font-size:15px;
  color:#c9c9c9;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.menu-group button{width:100%;min-height:44px;padding:10px 8px;font-size:13px}
.menu-shop{border-color:#65458a}
.menu-combat{border-color:#8b642e;background:rgba(35,29,20,.92)}
.menu-combat button{min-height:48px;font-size:14px}
.menu-info{border-color:#385c83}
.menu-join{display:flex;gap:5px;width:100%}
.menu-join input{min-width:0;flex:1;width:50px;padding:8px 4px}
.menu-join button{width:auto;flex:1}
.menu-error{margin:0;color:#ff7777}
@media(max-width:700px){
  #ov.menu-screen{padding:12px 10px;gap:10px;justify-content:flex-start}
  .menu-top{flex-direction:column;align-items:stretch;gap:8px}
  .menu-top > div:first-child{max-width:none !important}
  .menu-top h1{margin-top:8px;text-align:left;max-width:48%;font-size:24px}
  .menu-currency{font-size:11px;padding:7px 8px;max-width:none;white-space:normal;text-align:center}
  .menu-layout{grid-template-columns:1fr 1fr;gap:8px}
  .menu-combat{grid-column:1 / -1;grid-row:1}
  .menu-group{padding:10px 8px;gap:8px}
  .menu-group h2{font-size:12px}
  .menu-group button{font-size:12px;min-height:40px}
}
@media(max-width:380px){
  #ov.menu-screen{padding:8px 6px}
  .menu-layout{gap:6px}
  .menu-group{padding:8px 6px}
  .menu-group button{font-size:11px;padding:8px 5px}
}
.card.lock{opacity:.45}
.chip{display:inline-block;margin:3px 2px 0 0;padding:1px 7px;border-radius:9px;background:#555;font-size:11px}
.chip.on{background:#3498db}
button:disabled{opacity:.4;cursor:default}
.gp{outline:3px solid #f1c40f !important;outline-offset:2px}
#cfx{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.86);text-align:center}
.cf-chest{position:relative;z-index:1}.cf-shake{animation:cfshake .9s ease-in-out}
@keyframes cfshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.06)}30%{transform:rotate(8deg) scale(1.08)}45%{transform:rotate(-7deg) scale(1.1)}60%{transform:rotate(6deg) scale(1.1)}80%{transform:rotate(-3deg) scale(1.12)}}
.cf-glow{position:absolute;top:50%;left:50%;width:320px;height:320px;margin:-210px 0 0 -160px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,120,.95),rgba(255,200,50,0) 70%);opacity:0;transform:scale(.2)}
.cf-open .cf-glow{animation:cfglow .9s forwards}.cf-open .cf-lid{transform:rotate(-75deg)}
@keyframes cfglow{to{opacity:1;transform:scale(1.3)}}
.cf-pop{animation:cfpop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes cfpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
/* écran d'accueil */
#splash{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;background:#12061f;text-align:center}
#splash svg.bg{position:absolute;inset:0;width:100%;height:100%}
#splash .sun{transform-origin:450px 330px;animation:sunp 4s ease-in-out infinite}
@keyframes sunp{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:1}}
#splash .fg{animation:fgbob 2.2s ease-in-out infinite}#splash .fg.r{animation-delay:-1.1s}
@keyframes fgbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#splash .ttl{position:relative;margin:7% 0 0;font-size:clamp(38px,9.5vw,86px);font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;background:linear-gradient(180deg,#fff7c2,#ffb347 55%,#ff5e3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3b0d1e) drop-shadow(0 0 18px rgba(255,120,50,.6))}
#splash .sub{position:relative;margin:10px 0 0;color:#ffe6c7;font-size:clamp(13px,2.4vw,20px);letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 6px #000}
#splash .play{position:relative;margin-top:auto;margin-bottom:9%;padding:14px 56px;font-size:clamp(20px,3.6vw,30px);font-weight:900;letter-spacing:.12em;color:#fff;background:linear-gradient(180deg,#ff8a3d,#e0431f);border:3px solid #ffd9a0;border-radius:14px;cursor:pointer;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 10px 30px rgba(255,90,30,.5);animation:playp 1.4s ease-in-out infinite}
#splash .play:hover{filter:brightness(1.15)}
@keyframes playp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#splash .hint{position:absolute;bottom:3%;left:0;right:0;color:#cdb8e0;font-size:12px;opacity:.85}
#splash i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff7a1a;opacity:0;animation:ember linear infinite}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-620px) translateX(30px);opacity:0}}
/* Contrôles tactiles : visibles uniquement sur mobile / tablette, et seulement pendant un combat */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#touch{display:none;position:absolute;left:0;right:0;bottom:0;padding:0 10px 10px;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5;user-select:none;-webkit-user-select:none;touch-action:none}
#touch button,#tmenu button{pointer-events:auto;touch-action:none;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:bold;width:clamp(46px,9vw,68px);height:clamp(46px,9vw,68px);padding:0;margin:3px;-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(52,152,219,.7)}
#touch .pad{display:flex;flex-direction:column;align-items:center}
#touch .row{display:flex}
#touch .acts{display:grid;grid-template-columns:auto auto}
#touch .ult{background:rgba(241,196,15,.45)}
#tmenu{display:none;position:absolute;top:4px;right:6px;z-index:5}
#tmenu button{width:40px;height:40px;font-size:18px}
#rot{display:none;position:absolute;top:0;left:0;right:0;background:#e67e22;color:#fff;text-align:center;padding:5px;font-size:13px;z-index:6}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){#wrap{width:auto}canvas{width:min(100vw,200vh);height:auto}}
</style>
</head>
<body>
<div id="wrap">
	<div id="rot">📱 Tourne ton téléphone en mode paysage pour mieux jouer</div>
	<canvas id="c" width="2400" height="1200"></canvas>
	<div id="ov"></div>
	<div id="cfx"></div>
	<div id="splash">
		<svg class="bg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
			<defs>
				<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12061f"/><stop offset=".55" stop-color="#5b1a4a"/><stop offset=".85" stop-color="#e8623a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
				<radialGradient id="sg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3b0"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>
			</defs>
			<rect width="900" height="600" fill="url(#sky)"/>
			<g fill="#fff" opacity=".7"><circle cx="90" cy="70" r="1.6"/><circle cx="210" cy="140" r="1.2"/><circle cx="330" cy="50" r="1.8"/><circle cx="560" cy="90" r="1.4"/><circle cx="700" cy="40" r="1.8"/><circle cx="820" cy="130" r="1.3"/><circle cx="760" cy="200" r="1.1"/><circle cx="130" cy="220" r="1.1"/></g>
			<circle class="sun" cx="450" cy="330" r="190" fill="url(#sg)"/>
			<path d="M0 470 L120 360 L210 430 L330 320 L450 440 L580 340 L700 430 L800 350 L900 440 V600 H0Z" fill="#2a0d33"/>
			<path d="M0 510 L150 430 L260 490 L400 420 L520 500 L660 430 L780 500 L900 450 V600 H0Z" fill="#190722"/>
			<path d="M120 0 L330 600 M700 0 L560 600" stroke="rgba(255,220,160,.07)" stroke-width="60"/>
			<rect y="526" width="900" height="74" fill="#07030f"/><rect y="526" width="900" height="3" fill="#ff8a3d" opacity=".7"/>
			<g class="fg" fill="#07030f"><circle cx="250" cy="372" r="22"/><path d="M228 396 H272 L278 480 H222Z"/><rect x="230" y="476" width="17" height="52"/><rect x="253" y="476" width="17" height="52"/><path d="M268 410 L352 372 L360 382 L276 426Z"/><path d="M228 360 L238 336 L246 352 L254 332 L262 354 L272 340 L270 362Z"/></g>
			<g class="fg r" fill="#07030f" transform="translate(900,0) scale(-1,1)"><circle cx="250" cy="372" r="22"/><path d="M228 396 H272 L278 480 H222Z"/><rect x="230" y="476" width="17" height="52"/><rect x="253" y="476" width="17" height="52"/><path d="M268 410 L352 372 L360 382 L276 426Z"/><path d="M226 356 Q250 330 274 356 L268 346 L250 338 L232 346Z"/></g>
		</svg>
		<h1 class="ttl">⚔️ DUEL ARENA</h1>
		<p class="sub">Le combat commence ici</p>
		<button class="play" id="playbtn">▶ JOUER</button>
		<div class="hint">Clique, ou appuie sur Entrée / ✕ (A) pour commencer</div>
	</div>
	<div id="touch">
		<div class="pad"><button data-k="u">▲</button><div class="row"><button data-k="l">◀</button><button data-k="d">▼</button><button data-k="r">▶</button></div></div>
		<div class="acts"><button data-k="0">J</button><button data-k="1">K</button><button data-k="2">L</button><button data-k="3" class="ult">U</button></div>
	</div>
	<div id="tmenu"><button id="tr">↺</button><button id="tq">✕</button></div>
</div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), ov = document.getElementById('ov');
let ws, me = -1, chars = [], S = null, code = '', err = '', last = '';
const keys = {};

// ====== CATALOGUE de la boutique (4 articles au hasard par jour et par joueur ; pour en ajouter, copie une ligne) ======
// type 'skin' : change les couleurs d'un perso ('pal' = { couleur d'origine : nouvelle couleur })
// type 'char' : verrouille un perso tant qu'il n'est pas acheté
const SHOP = [
  { id: 'perso_luffy', type: 'char', char: 'Luffy', name: 'Luffy', price: 200, desc: 'One Piece : coups élastiques, Gear Second' },
  { id: 'perso_naruto', type: 'char', char: 'Naruto', name: 'Naruto', price: 200, desc: 'Naruto : clones, Rasengan, Rasenshuriken' },
  { id: 'perso_gojo', type: 'char', char: 'Gojo', name: 'Gojo Satoru', price: 300, desc: 'Jujutsu Kaisen : sphères Rouge et Bleu, soin, Infini' },
  { id: 'perso_deku', type: 'char', char: 'Deku', name: 'Izuku Midoriya', price: 250, desc: 'My Hero Academia : One For All, Air Force, Detroit Smash' },
  { id: 'perso_denji', type: 'char', char: 'Denji', name: 'Denji', price: 300, desc: 'Chainsaw Man : Pochita, recul, transformation' },
  { id: 'perso_yugo', type: 'char', char: 'Yugo', name: 'Yugo', price: 300, desc: 'Wakfu : gros laser, portail, épée, forme laser' },
  { id: 'perso_shinra', type: 'char', char: 'Shinra', name: 'Shinra', price: 400, desc: 'Fire Force : vol, coup de pied à visée auto, explosions, Pas du Diable' },
  { id: 'perso_eren', type: 'char', char: 'Eren', name: 'Eren Yeager', price: 400, desc: "L'Attaque des Titans : grappins, Titan Assaillant" },
  { id: 'perso_koro', type: 'char', char: 'Koro', name: 'Koro-sensei', price: 200, desc: 'Assassination Classroom : tentacules, Mach 20' },
  { id: 'perso_ichigo', type: 'char', char: 'Ichigo', name: 'Ichigo Kurosaki', price: 50, desc: 'Bleach : Zangetsu, Getsuga Tenshō, Shunpo, Bankai' },
  { id: 'perso_kairos', type: 'char', char: 'Kairos', name: 'Kairos', price: 350, desc: 'Perso original : écho temporel, rembobinage, arrêt du temps' },
  { id: 'skin_kaze_or', type: 'skin', char: 'Kaze', name: 'Kaze doré', price: 150, pal: { '#1c1c28': '#c9a227', '#2ecc71': '#fff4c2' } },
  { id: 'skin_bruno_bleu', type: 'skin', char: 'Bruno', name: 'Bruno bleu', price: 150, pal: { '#e74c3c': '#3498db', '#ff7675': '#74b9ff' } },
  { id: 'skin_zephyr_blanc', type: 'skin', char: 'Zéphyr', name: 'Zéphyr blanc', price: 150, pal: { '#6c3483': '#f2f4f6', '#5b2c6f': '#dfe6e9', '#4a235a': '#b2bec3', '#ecf0f1': '#b0b8bf' } },
  { id: 'skin_chevalier_noir', type: 'skin', char: 'Chevalier', name: 'Chevalier noir', price: 150, pal: { '#b0bec5': '#2b2b33', '#cfd8dc': '#454550', '#78909c': '#1c1c24', '#455a64': '#111118', '#90a4ae': '#55555f', '#2c5fa8': '#22222b' } },
  { id: 'skin_viking_rouge', type: 'skin', char: 'Viking', name: 'Viking rouge', price: 150, pal: { '#6d4c41': '#c0392b', '#4e342e': '#7b241c', '#d35400': '#e67e22', '#3e2723': '#4a1410' } },
  { id: 'skin_gojo_lunettes', type: 'skin', char: 'Gojo', name: 'Gojo lunettes (saison 2)', price: 150, look: 'glasses', pal: {} },
  { id: 'skin_luffy_gear4', type: 'skin', char: 'Luffy', name: 'Luffy Gear 4 Snakeman', price: 250, look: 'snake', pal: { '#e74c3c': '#f5cba7', '#3b6fd8': '#c0392b' } },
  { id: 'skin_deku_dark', type: 'skin', char: 'Deku', name: 'Dark Deku', price: 250, look: 'dark', pal: { '#2e7d32': '#2a6a30', '#1b5e20': '#143318', '#c0392b': '#1c1c22', '#b0bec5': '#3a3a42', '#78909c': '#111', '#fff': '#9dff9d', '#d5dbdb': '#26262c' } },
  { id: 'skin_naruto_hermite', type: 'skin', char: 'Naruto', name: 'Naruto Mode Hermite', price: 150, look: 'sage', pal: { '#ff7f27': '#d0451b', '#2c5fa8': '#222', '#2c3e50': '#111' } },
  { id: 'skin_koro_blanc', type: 'skin', char: 'Koro', name: 'Koro-sensei blanc', price: 150, look: 'white', pal: { '#f4d03f': '#f5f5f1', '#e6b800': '#dcdcd5', '#f1c40f': '#e8e8e2' } },
  { id: 'skin_shinra_banshoman', type: 'skin', char: 'Shinra', name: 'Shinra Banshoman', price: 250, look: 'banshoman', pal: { '#f5cba7': '#b8402f', '#23232f': '#a63a2f', '#1b1b24': '#7a2a22', '#bdc3c7': '#a63a2f', '#111': '#3a1410', '#15151c': '#e9e9e9', '#000': '#fff' } },
  { id: 'skin_ichigo_bloodchains', type: 'skin', char: 'Ichigo', name: 'Ichigo - Sauveur de Rukia', price: 250, look: 'bloodchains', desc: 'Ichigo à Soul Society : grand manteau beige à capuche pointue, tunique noire, bandages, obi blanc et Zangetsu au ruban blanc', pal: {} },
  { id: 'skin_kairos_azur', type: 'skin', char: 'Kairos', name: 'Kairos azur', price: 150, pal: { '#3b2a5a': '#174b63', '#2b1f3d': '#102f45', '#2a2038': '#163b50', '#d9b84a': '#55d6d2', '#f5ecd0': '#d9ffff' } },
];
let tNew = '', chestGain = '', chestNew = null, chestErr = '', fList = [], fErr = '', fDraft = '', fAdd = null, pName = '', pIcon = '🥷', pErr = '', earnedXp = 0, lvUp = 0, earnedCr = 0, rw = 0, pre = null, kNew = 0;
let save = { coins: 0, crystals: 0, xp: 0, chests: 0, icons: [], profile: null, friends: [], fid: null, kw: 0, quests: null, daily2: null, owned: [], skin: {}, daily: null, stats: { played: 0, wins: 0, losses: 0, byChar: {} } }, view = 'menu', earned = 0, paid = 0, maps = [], searching = false, infoIdx = null, q2 = null;
if (!save.stats || typeof save.stats !== 'object') save.stats = { played: 0, wins: 0, losses: 0, byChar: {} };
if (!save.stats.byChar || typeof save.stats.byChar !== 'object') save.stats.byChar = {};
save.stats.played = Number(save.stats.played) || 0;
save.stats.wins = Number(save.stats.wins) || 0;
save.stats.losses = Number(save.stats.losses) || 0;
try { Object.assign(save, JSON.parse(localStorage.getItem('duelArena') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('duelArena', JSON.stringify(save)); } catch (e) {} };
// Offre de lancement Ichigo Sauveur de Rukia : 10 minutes à partir du premier lancement de cette version du jeu.
const ICHIGO_PROMO_KEY = 'ichigoBloodchainsPromoStart';
let ichigoPromoStart = 0;
try { ichigoPromoStart = Number(localStorage.getItem(ICHIGO_PROMO_KEY)) || 0; } catch (e) {}
if (!ichigoPromoStart) { ichigoPromoStart = Date.now(); try { localStorage.setItem(ICHIGO_PROMO_KEY, String(ichigoPromoStart)); } catch (e) {} }
const ICHIGO_PROMO_END = ichigoPromoStart + 10 * 60 * 1000;
const ichigoPromoActive = () => Date.now() < ICHIGO_PROMO_END;
const ichigoPromoRemaining = () => Math.max(0, ICHIGO_PROMO_END - Date.now());

      { type: 'char', param: ch, goal: 2, text: 'Jouer 2 parties avec ' + ch, rw: 'k', n: 1 },
      { type: 'earn', goal: 80, text: 'Gagner 80 pièces en combat', rw: 'k', n: 1 },
      { type: 'rm', param: mp, goal: 1, text: 'Gagner une manche sur la map ' + MAPN[mp], rw: 'k', n: 1 }];
    save.quests = { day: dayKey() + 'k2', list: shuf(pool).slice(0, 4).map(q => ({ ...q, p: 0, done: 0 })) }; persist();
  }
  return save.quests.list;
}
function qTrack(type, n, param) {
  questList().forEach(q => {
    if (q.done || q.type !== type || (q.param !== undefined && String(q.param) !== String(param))) return;
    q.p = Math.min(q.goal, q.p + n);
    if (q.p >= q.goal) { q.done = 1; addXp(40); if (q.rw === 'g') save.crystals += q.n; else if (q.rw === 'k') save.chests = (save.chests || 0) + q.n; else save.coins += q.n; }
  });
  persist();
}
