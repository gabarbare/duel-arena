
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Arena</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;background:#222}
#ov{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);text-align:center;padding:10px;box-sizing:border-box}

/* Amélioration de l'écran de sélection */
#ov.select{
	justify-content:flex-start;
	padding:14px 12px;
	overflow-y:auto;
}
#ov.select .cards{
	display:grid;
	grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
	gap:8px;
	width:min(100%,780px);
	max-height:285px;
	overflow-y:auto;
	align-content:start;
	padding:4px;
	box-sizing:border-box;
}
#ov.select .card{
	width:auto;
	min-width:0;
	font-size:12px;
}
@media(max-width:600px){
	#ov.select{
		padding:8px 6px;
		gap:6px;
	}
	#ov.select .cards{
		grid-template-columns:repeat(auto-fit,minmax(115px,1fr));
		max-height:260px;
	}
	#ov.select .card{
		font-size:11px;
	}
}

button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}
button{background:#3498db;color:#fff;cursor:pointer}
input{text-transform:uppercase;width:90px;text-align:center}
.cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card{background:#222;border:3px solid #444;border-radius:10px;padding:6px;width:92px;cursor:pointer;font-size:11px;text-align:left;line-height:1.5}
.card.sel{background:#444}
#ov.end{background:rgba(0,0,0,.4);justify-content:flex-end;padding-bottom:24px}
.card.lock{opacity:.45}
.chip{display:inline-block;margin:3px 2px 0 0;padding:1px 7px;border-radius:9px;background:#555;font-size:11px}
.chip.on{background:#3498db}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="wrap">
	<canvas id="c" width="900" height="600"></canvas>
	<div id="ov"></div>
</div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), ov = document.getElementById('ov');
let ws, me = -1, chars = [], S = null, code = '', err = '', last = '';
const keys = {};

// ====== BOUTIQUE : articles à vendre (pour en ajouter, copie une ligne) ======
// type 'skin' : change les couleurs d'un perso ('pal' = { couleur d'origine : nouvelle couleur })
// type 'char' : verrouille un perso tant qu'il n'est pas acheté
const SHOP = [
  { id: 'perso_yugo', type: 'char', char: 'Yugo', name: 'Yugo', price: 300, desc: 'Wakfu : portails et énergie' },
  { id: 'perso_shinra', type: 'char', char: 'Shinra', name: 'Shinra Kusakabe', price: 400, desc: 'Fire Force : vol et vitesse lumière' },
  { id: 'perso_koro', type: 'char', char: 'Koro-sensei', name: 'Koro-sensei', price: 200, desc: 'Assassination Classroom : vitesse et tentacules' },
  { id: 'perso_gojo', type: 'char', char: 'Gojo', name: 'Gojo Satoru', price: 400, desc: 'Jujutsu Kaisen : Rouge, Bleu, soin, Infini' },
  { id: 'perso_deku', type: 'char', char: 'Deku', name: 'Izuku Midoriya', price: 300, desc: 'My Hero Academia : One For All' },
  { id: 'perso_denji', type: 'char', char: 'Denji', name: 'Denji', price: 300, desc: 'Chainsaw Man : Pochita et transformation' },
  { id: 'perso_luffy', type: 'char', char: 'Luffy', name: 'Monkey D. Luffy', price: 200, desc: 'One Piece : combattant élastique' },
  { id: 'perso_naruto', type: 'char', char: 'Naruto', name: 'Naruto Uzumaki', price: 200, desc: 'Naruto : clones et Rasengan' },
  { id: 'skin_kaze_or', type: 'skin', char: 'Kaze', name: 'Kaze doré', price: 60, pal: { '#1c1c28': '#c9a227', '#2ecc71': '#fff4c2' } },
  { id: 'skin_bruno_bleu', type: 'skin', char: 'Bruno', name: 'Bruno bleu', price: 60, pal: { '#e74c3c': '#3498db', '#ff7675': '#74b9ff' } },
  { id: 'skin_zephyr_blanc', type: 'skin', char: 'Zéphyr', name: 'Zéphyr blanc', price: 60, pal: { '#6c3483': '#f2f4f6', '#5b2c6f': '#dfe6e9', '#4a235a': '#b2bec3', '#ecf0f1': '#b0b8bf' } },
  { id: 'skin_chevalier_noir', type: 'skin', char: 'Chevalier', name: 'Chevalier noir', price: 60, pal: { '#78909c': '#252932', '#455a64': '#11151d', '#b0bec5': '#343b49', '#2c5fa8': '#090d16', '#5d4037': '#171a22', '#90a4ae': '#596273', '#cfd8dc': '#697386', '#c0392b': '#111111' } },
  { id: 'skin_viking_rouge', type: 'skin', char: 'Viking', name: 'Viking rouge', price: 60, pal: { '#6d4c41': '#8f2028', '#4e342e': '#5d1018', '#3e2723': '#29090e', '#d35400': '#a51e27', '#95a5a6': '#c4c8ce', '#7f8c8d': '#777e88' } },
  { id: 'skin_luffy_noir', type: 'skin', char: 'Luffy', name: 'Luffy sombre', price: 60, pal: { '#e74c3c': '#252b38', '#3b6fd8': '#39465c', '#f1c40f': '#d7dbe2', '#c0392b': '#111820' } },
  { id: 'skin_naruto_bleu', type: 'skin', char: 'Naruto', name: 'Naruto bleu', price: 60, pal: { '#ff7f27': '#2878c8', '#f9e03b': '#d7ecff', '#2c5fa8': '#14385e' } },
  { id: 'skin_denji_blanc', type: 'skin', char: 'Denji', name: 'Denji blanc', price: 60, pal: { '#d4402f': '#e7e7e7', '#f2f2f2': '#ffffff', '#f4d03f': '#d8d8d8' } }
];
const shopDay = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function refreshDailyShop() {
  const today = shopDay();
  if (save.shopDate !== today || !Array.isArray(save.dailyShopIds) || save.dailyShopIds.length !== 4 || save.dailyShopIds.some(id => !SHOP.some(q => q.id === id)) || new Set(save.dailyShopIds).size !== 4) {
    const pool = SHOP.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    save.shopDate = today;
    save.dailyShopIds = pool.slice(0, 4).map(q => q.id);
    persist();
  }
  return save.dailyShopIds.map(id => SHOP.find(q => q.id === id)).filter(Boolean);
}
let DAILY_SHOP = [];
let save = { coins: 0, owned: [], skin: {}, shopDate: '', dailyShopIds: [] }, view = 'menu', earned = 0, paid = 0, maps = [], searching = false;
try { Object.assign(save, JSON.parse(localStorage.getItem('duelArena') || '{}')); } catch (e) {}
save.owned = Array.isArray(save.owned) ? save.owned : []; save.skin = save.skin && typeof save.skin === 'object' ? save.skin : {}; save.coins = Number.isFinite(save.coins) ? save.coins : 0;
const persist = () => { try { localStorage.setItem('duelArena', JSON.stringify(save)); } catch (e) {} };
DAILY_SHOP = refreshDailyShop();
const owns = id => save.owned.includes(id);
const locked = name => SHOP.some(q => q.type === 'char' && q.char === name && !owns(q.id));
function buy(id) {
  DAILY_SHOP = refreshDailyShop();
  const q = DAILY_SHOP.find(z => z.id === id);
  if (!q || owns(id) || save.coins < q.price) return;
  save.coins -= q.price; save.owned.push(id); persist(); ui();
}

function connect(first) {
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => w.send(JSON.stringify(first));
  w.onmessage = e => {
    if (w !== ws) return;
    const m = JSON.parse(e.data);
    if (m.t === 'chars') { chars = m.chars; view = 'training'; ui(); }
    else if (m.t === 'room') { me = m.idx; chars = m.chars; maps = m.maps; code = m.code; searching = false; }
    else if (m.t === 'err') { err = m.m; me = -1; S = null; searching = false; w.close(); }
    else if (m.t === 's') {
      S = m;
      if (m.p === 'end' && m.co) { if (!paid) { paid = 1; earned = m.co[me]; save.coins += earned; persist(); } } else paid = 0;
    }
    ui();
  };
  w.onclose = () => { if (w === ws && me >= 0) { err = 'Connexion perdue'; me = -1; S = null; ui(); } };
}
const go = o => { err = ''; connect(o); };
const search = () => { err = ''; searching = true; connect({ t: 'queue' }); ui(); };
function openTraining() { view = 'training'; if (!chars.length || !ws || ws.readyState !== 1) connect({ t: 'training_list' }); else ui(); }
function startTraining(i) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'train', c: i, sk: save.skin[chars[i].name] || '' })); }
const pick = i => { if (locked(chars[i].name)) return; ws.send(JSON.stringify({ t: 'pick', c: i, sk: save.skin[chars[i].name] || '' })); };
const again = () => ws.send(JSON.stringify({ t: 'again' }));
function leave() { me = -1; S = null; err = ''; view = 'menu'; searching = false; try { ws.close(); } catch (e) {} ui(); }
function setSkin(name, id, i) { save.skin[name] = id; persist(); if (S && S.p === 'select' && S.sel[me] === i) pick(i); ui(); }

const shopHtml = () => { DAILY_SHOP = refreshDailyShop(); return `<h2>🛒 Boutique quotidienne</h2><p>🪙 ${save.coins} pièces</p><p>4 offres du jour · renouvellement à minuit</p><div class="cards">${DAILY_SHOP.map(q => `<div class="card" style="cursor:default"><b>${q.name}</b><br>${q.type === 'skin' ? 'Skin · ' + q.char : 'Personnage'}<br>${q.desc || ''}<br>${owns(q.id) ? '✓ Possédé' : `<button ${save.coins < q.price ? 'disabled' : ''} onclick="buy('${q.id}')">${q.price} 🪙</button>`}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`; };
const quitBtn = '<button onclick="leave()" style="background:#7f8c8d">Retour au menu</button>';
setInterval(() => { const oldDay = save.shopDate; DAILY_SHOP = refreshDailyShop(); if (oldDay !== save.shopDate && me < 0 && view === 'shop') ui(); }, 30000);

function ui() {
  let h = '';
  ov.className = me >= 0 && S && S.p === 'end' ? 'end' : '';
  if (me < 0 && searching) h = `<h2>🔎 Recherche d’un adversaire…</h2><p>Tu seras mis face à un joueur aléatoire.</p>${quitBtn.replace('Retour au menu', 'Annuler')}`;
  else if (me < 0) h = view === 'training' ? `<h2>🎯 Mode entraînement</h2><p>Choisis librement ton personnage : même ceux que tu n'as pas encore débloqués sont disponibles.</p><div class="cards">${chars.map((ch, i) => `<div class="card" style="border-color:${ch.color}" onclick="startTraining(${i})"><b style="color:${ch.color}">${ch.name}</b><br>${ch.desc}<br>PV : ${ch.hp}<br>${ch.atk.map((a,j) => 'JKLU'[j] + ' : ' + a).join('<br>')}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>` : view === 'shop' ? shopHtml() : `<h1>⚔️ Duel Arena</h1><p>🪙 ${save.coins} pièces</p>${err ? `<p style="color:#f66">${err}</p>` : ''}
    <button onclick="search()" style="background:#e67e22">🎲 Matchmaking (adversaire aléatoire)</button>
    <button onclick="go({t:'create'})">Créer une partie</button>
    <div>ou <input id="cd" maxlength="4" placeholder="CODE" value="${location.hash.slice(1)}"> <button onclick="go({t:'join',code:document.getElementById('cd').value})">Rejoindre</button></div>
    <button onclick="openTraining()" style="background:#16a085">🎯 Mode entraînement</button>
    <button onclick="view='shop';ui()" style="background:#8e44ad">🛒 Boutique</button>`;
  else if (!S || S.p === 'wait') h = `<h2>En attente de l’adversaire…</h2><p>Code : <b style="font-size:34px">${code}</b></p><p>Ou envoie-lui ce lien :<br><b>${location.origin}/#${code}</b></p>${quitBtn}`;
  else if (S.p === 'select') h = `<h2>Choisis ton combattant</h2><div class="cards">${chars.map((c, i) => {
      const lk = locked(c.name), sks = SHOP.filter(q => q.type === 'skin' && q.char === c.name && owns(q.id)), cur = save.skin[c.name] || '';
      return `<div class="card ${S.sel[me] === i ? 'sel' : ''} ${lk ? 'lock' : ''}" style="border-color:${c.color}" onclick="pick(${i})"><b style="color:${c.color};font-size:13px">${c.name}</b>${lk ? ' 🔒' : ''}<br>${c.desc}<br>PV : ${c.hp}<br>${c.atk.map((a, j) => 'JKLU'[j] + ' : ' + a).join('<br>')}${c.alt ? '<br><small>🪚 ' + c.alt.join(' / ') + '</small>' : ''}${sks.length ? '<br>' + [{ id: '', name: 'Normal' }, ...sks].map(q => `<span class="chip ${cur === q.id ? 'on' : ''}" onclick="event.stopPropagation();setSkin('${c.name}','${q.id}',${i})">${q.name}</span>`).join('') : ''}</div>`;
    }).join('')}</div>
    <p>${S.sel[me] != null ? 'Tu es prêt ✔' : ''} ${S.sel[1 - me] != null ? '· Adversaire prêt ✔' : ''}</p>
    <p style="font-size:13px;opacity:.8">Flèches ou ZQSD : bouger, sauter (haut), bloquer (bas) · J K L : attaques · U ou Espace : ultime (barre pleine)</p>${quitBtn}`;
  else if (S.p === 'training') { ov.style.display = 'none'; last = ''; return; }
  else if (S.p === 'end') h = `<p style="font-size:18px">🪙 +${earned} pièces (total : ${save.coins})</p>${S.ag[me] ? '<p>En attente de l’adversaire…</p>' : '<button onclick="again()">⚔️ Revanche</button>'} ${quitBtn}`;
  else { ov.style.display = 'none'; last = ''; return; }
  if (h !== last) { ov.innerHTML = h; last = h; }
  ov.style.display = 'flex';
}

const map = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', KeyJ: 0, KeyK: 1, KeyL: 2, KeyU: 3, Space: 3 };
function key(e) {
  if (S && S.p === 'training' && e.type === 'keydown') {
    if (e.code === 'KeyR') { e.preventDefault(); ws.send(JSON.stringify({ t: 'training_reset' })); return; }
    if (e.code === 'Escape') { e.preventDefault(); leave(); return; }
  }
  const k = map[e.code];
  if (k === undefined || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  const v = e.type === 'keydown';
  if (!!keys[k] !== v) {
    keys[k] = v;
    if (ws && ws.readyState === 1 && me >= 0) ws.send(JSON.stringify({ t: 'in', l: keys.l, r: keys.r, u: keys.u, d: keys.d, a: [keys[0], keys[1], keys[2], keys[3]] }));
  }
}
addEventListener('keydown', key); addEventListener('keyup', key);

const fmt = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');

let FL = 0;
let PAL = null;
const P = v => FL ? '#fff' : (PAL && PAL[v]) || v;
const R = (v, a, b, w, h) => { x.fillStyle = P(v); x.fillRect(a, b, w, h); };
const C = (v, a, b, r) => { x.fillStyle = P(v); x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); };
const Y = (v, pts) => { x.fillStyle = P(v); x.beginPath(); pts.forEach((p, j) => j ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); };
const LN = (v, w, a, b, c2, d) => { x.strokeStyle = P(v); x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); };

const rasen = (px, py, r, bl) => {
  x.fillStyle = 'rgba(93,173,226,.9)'; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  x.strokeStyle = '#ecf0f1'; x.lineWidth = 2; const a = Date.now() / 60;
  for (let q = 0; q < 3; q++) { x.beginPath(); x.arc(px, py, r * (.35 + q * .22), a + q * 2, a + q * 2 + 3); x.stroke(); }
  if (bl) for (let q = 0; q < 4; q++) { const g = a / 3 + q * Math.PI / 2; Y('#ecf0f1', [[px + Math.cos(g) * r, py + Math.sin(g) * r], [px + Math.cos(g + .3) * r * 1.6, py + Math.sin(g + .3) * r * 1.6], [px + Math.cos(g + .6) * r, py + Math.sin(g + .6) * r]]); }
};
const orb = (px, py, r, col, core) => {
  x.fillStyle = col; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  x.fillStyle = core; x.beginPath(); x.arc(px, py, r * .5, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 2; const a = Date.now() / 80;
  x.beginPath(); x.arc(px, py, r * 1.3, a, a + 2.2); x.stroke();
};
const shield = (px, py, z) => {
  const pts = m => [[-12 * m, -22 * m], [12 * m, -22 * m], [12 * m, 6 * m], [0, 24 * m], [-12 * m, 6 * m]].map(q => [px + q[0] * z, py + q[1] * z]);
  Y('#f1c40f', pts(1)); Y('#2c5fa8', pts(.8));
  R('#f1c40f', px - 1.5 * z, py - 17 * z, 3 * z, 34 * z); R('#f1c40f', px - 9 * z, py - 6 * z, 18 * z, 3 * z);
};
const sword = (hx, hy, tx, ty, col) => {
  const dx = tx - hx, dy = ty - hy;
  LN(col || '#dfe6e9', 5, hx, hy, tx, ty); LN('#f1c40f', 4, hx + dy * .15, hy - dx * .15, hx - dy * .15, hy + dx * .15);
};

function fighter(f, i) {
  const c = chars[f.c], s = f.fc, n = c.name, t = Date.now();
  FL = f.fl;
  const sd = f.sk && SHOP.find(q => q.id === f.sk); PAL = sd && sd.pal || null;
  x.save(); x.translate(f.x, f.y);
  if (f.iv) x.globalAlpha = .45;
  const gn = n === 'Gojo', dk = n === 'Deku';
  if (f.fly || f.light) { x.fillStyle = 'rgba(255,130,30,.22)'; x.beginPath(); x.arc(0, -55, 66, 0, 7); x.fill(); }
  if (f.ak === 3 || f.bf || (gn && f.ak === 2) || (n === 'Denji' && f.fm)) {
    x.fillStyle = gn && f.ak === 2 ? 'rgba(120,255,170,.3)' : f.ak === 3 ? 'rgba(255,230,80,.35)' : dk ? 'rgba(90,255,120,.28)' : 'rgba(255,90,90,.3)';
    x.beginPath(); x.arc(0, -55, 75, 0, 7); x.fill();
    if (dk && f.bf) {
      x.strokeStyle = '#8dff8d'; x.lineWidth = 2; const q0 = (t / 70) | 0;
      for (let q = 0; q < 6; q++) { const bx = -40 + ((q * 37 + q0 * 11) % 80), by = -100 + ((q * 53 + q0 * 7) % 90); x.beginPath(); x.moveTo(bx, by); x.lineTo(bx + 7, by - 12); x.lineTo(bx - 4, by - 20); x.stroke(); }
    }
  }
  if (f.sh > 0) {
    x.fillStyle = 'rgba(120,200,255,' + (.15 + .08 * Math.sin(t / 150)) + ')'; x.strokeStyle = 'rgba(150,220,255,.9)'; x.lineWidth = 3;
    x.beginPath(); x.arc(0, -55, 68, 0, 7); x.fill(); x.stroke();
  }
  const skin = n === 'Viking' ? '#e0ac69' : n === 'Bruno' ? '#e8b48a' : '#f5cba7';
  if (n === 'Bruno') { // boxeur : torse nu, short rouge, gants, bandeau
    R(skin, -16, -26, 13, 26); R(skin, 3, -26, 13, 26);
    R('#222', -18, -8, 17, 8); R('#222', 1, -8, 17, 8);
    R(skin, -22, -90, 44, 42);
    R('#e74c3c', -22, -52, 44, 28); R('#fff', -22, -52, 44, 5); R('#fff', -3, -47, 6, 23);
    C(skin, 0, -102, 14);
    x.fillStyle = P('#1a1a1a'); x.beginPath(); x.arc(0, -104, 14, Math.PI, 0); x.fill();
    R('#e74c3c', -14, -109, 28, 3);
    R('#000', s * 6 - 2, -104, 4, 4);
  } else if (n === 'Kaze') { // ninja : tenue noire, ceinture et bandeau verts qui flottent, katana dans le dos
    R('#1c1c28', -16, -28, 13, 28); R('#1c1c28', 3, -28, 13, 28);
    R('#2ecc71', -16, -12, 13, 3); R('#2ecc71', 3, -12, 13, 3);
    R('#1c1c28', -22, -90, 44, 64);
    R('#2ecc71', -22, -54, 44, 6);
    const w = Math.sin(t / 90) * 4;
    Y('#2ecc71', [[-s * 20, -54], [-s * 36, -42 + w], [-s * 32, -36 + w], [-s * 18, -48]]);
    LN('#7f8c8d', 4, -s * 18, -30, s * 16, -98); LN('#6d4c41', 5, s * 16, -98, s * 21, -110);
    C('#1c1c28', 0, -102, 14);
    R('#f5cba7', -12, -108, 24, 8);
    R('#fff', s * 4, -106, 5, 3); R('#000', s * 6, -106, 3, 3);
    R('#2ecc71', -14, -115, 28, 4);
    const w2 = Math.sin(t / 80) * 5;
    Y('#2ecc71', [[-s * 14, -114], [-s * 38, -109 + w2], [-s * 36, -116 + w2], [-s * 14, -118]]);
    R('#bdc3c7', -5, -115, 10, 4);
  } else if (n === 'Zéphyr') { // sorcier : robe étoilée, barbe, grand chapeau pointu
    Y('#6c3483', [[-20, -90], [20, -90], [28, 0], [-28, 0]]);
    R('#f1c40f', -24, -52, 48, 5);
