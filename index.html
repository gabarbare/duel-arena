<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel Arena</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;background:#222}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);text-align:center;padding:10px;box-sizing:border-box}
button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}
button{background:#3498db;color:#fff;cursor:pointer}
input{text-transform:uppercase;width:90px;text-align:center}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#222;border:3px solid #444;border-radius:10px;padding:10px;width:150px;cursor:pointer;font-size:13px;text-align:left;line-height:1.5}
.card.sel{background:#444}
</style></head><body>
<div id="wrap"><canvas id="c" width="900" height="450"></canvas><div id="ov"></div></div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), ov = document.getElementById('ov');
let ws, me = -1, chars = [], S = null, code = '', err = '', last = '';
const keys = {};

function connect(first) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify(first));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'room') { me = m.idx; chars = m.chars; code = m.code; }
    else if (m.t === 'err') { err = m.m; me = -1; S = null; ws.close(); }
    else if (m.t === 's') S = m;
    ui();
  };
  ws.onclose = () => { if (me >= 0) { err = 'Connexion perdue'; me = -1; S = null; ui(); } };
}
const go = o => { err = ''; connect(o); };
const pick = i => ws.send(JSON.stringify({ t: 'pick', c: i }));

function ui() {
  let h = '';
  if (me < 0) h = `<h1>⚔️ Duel Arena</h1>${err ? `<p style="color:#f66">${err}</p>` : ''}
    <button onclick="go({t:'create'})">Créer une partie</button>
    <div>ou <input id="cd" maxlength="4" placeholder="CODE" value="${location.hash.slice(1)}"> <button onclick="go({t:'join',code:document.getElementById('cd').value})">Rejoindre</button></div>`;
  else if (!S || S.p === 'wait') h = `<h2>En attente de l’adversaire…</h2><p>Code : <b style="font-size:34px">${code}</b></p><p>Ou envoie-lui ce lien :<br><b>${location.origin}/#${code}</b></p>`;
  else if (S.p === 'select') h = `<h2>Choisis ton combattant</h2><div class="cards">${chars.map((c, i) =>
    `<div class="card ${S.sel[me] === i ? 'sel' : ''}" style="border-color:${c.color}" onclick="pick(${i})"><b style="color:${c.color};font-size:16px">${c.name}</b><br>${c.desc}<br>PV : ${c.hp}<br>${c.atk.map((a, j) => 'JKLU'[j] + ' : ' + a).join('<br>')}</div>`).join('')}</div>
    <p>${S.sel[me] != null ? 'Tu es prêt ✔' : ''} ${S.sel[1 - me] != null ? '· Adversaire prêt ✔' : ''}</p>
    <p style="font-size:13px;opacity:.8">Flèches ou ZQSD : bouger, sauter (haut), bloquer (bas) · J K L : attaques · U ou Espace : ultime (barre pleine)</p>`;
  else { ov.style.display = 'none'; last = ''; return; }
  if (h !== last) { ov.innerHTML = h; last = h; }
  ov.style.display = 'flex';
}

const map = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', KeyJ: 0, KeyK: 1, KeyL: 2, KeyU: 3, Space: 3 };
function key(e) {
  const k = map[e.code];
  if (k === undefined || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  const v = e.type === 'keydown';
  if (!!keys[k] !== v) {
    keys[k] = v;
    if (ws && ws.readyState === 1 && me >= 0) ws.send(JSON.stringify({ t: 'in', l: keys.l, r: keys.r, u: keys.u, d: keys.d, a: [keys[0], keys[1], keys[2], keys[3]] }));
  }
}
addEventListener('keydown', key); addEventListener('keyup', key);

const fmt = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');

let FL = 0;
const P = v => FL ? '#fff' : v;
const R = (v, a, b, w, h) => { x.fillStyle = P(v); x.fillRect(a, b, w, h); };
const C = (v, a, b, r) => { x.fillStyle = P(v); x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); };
const Y = (v, pts) => { x.fillStyle = P(v); x.beginPath(); pts.forEach((p, j) => j ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); };
const LN = (v, w, a, b, c2, d) => { x.strokeStyle = P(v); x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); };

function fighter(f, i) {
  const c = chars[f.c], s = f.fc, n = c.name, t = Date.now();
  FL = f.fl;
  x.save(); x.translate(f.x, f.y);
  if (f.ak === 3 || f.bf) {
    x.fillStyle = f.ak === 3 ? 'rgba(255,230,80,.35)' : 'rgba(255,90,90,.3)';
    x.beginPath(); x.arc(0, -55, 75, 0, 7); x.fill();
  }
  const skin = n === 'Titan' ? '#e0ac69' : n === 'Bruno' ? '#e8b48a' : '#f5cba7';
  if (n === 'Bruno') { // boxeur : torse nu, short rouge, gants, bandeau
    R(skin, -16, -26, 13, 26); R(skin, 3, -26, 13, 26);
    R('#222', -18, -8, 17, 8); R('#222', 1, -8, 17, 8);
    R(skin, -22, -90, 44, 42);
    R('#e74c3c', -22, -52, 44, 28); R('#fff', -22, -52, 44, 5); R('#fff', -3, -47, 6, 23);
    C(skin, 0, -102, 14);
    x.fillStyle = P('#1a1a1a'); x.beginPath(); x.arc(0, -104, 14, Math.PI, 0); x.fill();
    R('#e74c3c', -14, -109, 28, 3);
    R('#000', s * 6 - 2, -104, 4, 4);
  } else if (n === 'Kaze') { // ninja : tenue noire, ceinture et bandeau verts qui flottent, katana dans le dos
    R('#1c1c28', -16, -28, 13, 28); R('#1c1c28', 3, -28, 13, 28);
    R('#2ecc71', -16, -12, 13, 3); R('#2ecc71', 3, -12, 13, 3);
    R('#1c1c28', -22, -90, 44, 64);
    R('#2ecc71', -22, -54, 44, 6);
    const w = Math.sin(t / 90) * 4;
    Y('#2ecc71', [[-s * 20, -54], [-s * 36, -42 + w], [-s * 32, -36 + w], [-s * 18, -48]]);
    LN('#7f8c8d', 4, -s * 18, -30, s * 16, -98); LN('#6d4c41', 5, s * 16, -98, s * 21, -110);
    C('#1c1c28', 0, -102, 14);
    R('#f5cba7', -12, -108, 24, 8);
    R('#fff', s * 4, -106, 5, 3); R('#000', s * 6, -106, 3, 3);
    R('#2ecc71', -14, -115, 28, 4);
    const w2 = Math.sin(t / 80) * 5;
    Y('#2ecc71', [[-s * 14, -114], [-s * 38, -109 + w2], [-s * 36, -116 + w2], [-s * 14, -118]]);
    R('#bdc3c7', -5, -115, 10, 4);
  } else if (n === 'Zéphyr') { // sorcier : robe étoilée, barbe, grand chapeau pointu
    Y('#6c3483', [[-20, -90], [20, -90], [28, 0], [-28, 0]]);
    R('#f1c40f', -24, -52, 48, 5);
    C('#f1c40f', -9, -72, 2.5); C('#f1c40f', 10, -30, 2.5); C('#f1c40f', -14, -20, 2.5);
    C(skin, 0, -102, 13);
    Y('#ecf0f1', [[-9, -97], [9, -97], [6, -78], [0, -67], [-6, -78]]);
    R('#000', s * 6 - 2, -106, 4, 4);
    x.fillStyle = P('#4a235a'); x.beginPath(); x.ellipse(0, -112, 26, 6, 0, 0, 7); x.fill();
    Y('#5b2c6f', [[-15, -113], [15, -113], [s * 8, -154]]);
    R('#f1c40f', -14, -117, 28, 4); C('#f1c40f', s * 2, -134, 3);
  } else if (n === 'Titan') { // viking : casque à cornes, barbe rousse, épaulières, ceinture dorée
    R('#4e342e', -17, -28, 15, 28); R('#4e342e', 2, -28, 15, 28);
    R('#2d2d2d', -19, -9, 18, 9); R('#2d2d2d', 1, -9, 18, 9);
    R('#6d4c41', -24, -92, 48, 66);
    R('#3e2723', -24, -38, 48, 7); R('#f1c40f', -6, -39, 12, 9);
    [[-12, -80], [0, -80], [12, -80], [-6, -66], [6, -66]].forEach(p => C('#f1c40f', p[0], p[1], 2.5));
    C('#95a5a6', -25, -88, 12); C('#95a5a6', 25, -88, 12); C('#7f8c8d', -25, -88, 6); C('#7f8c8d', 25, -88, 6);
    C(skin, 0, -104, 15);
    Y('#d35400', [[-13, -100], [13, -100], [10, -82], [0, -72], [-10, -82]]);
    x.fillStyle = P('#95a5a6'); x.beginPath(); x.arc(0, -106, 16, Math.PI, 0); x.fill();
    R('#95a5a6', -3, -106, 6, 12);
    R('#000', s * 6 - 2, -104, 4, 4);
    [-1, 1].forEach(d => { x.fillStyle = P('#ecf0f1'); x.beginPath(); x.moveTo(d * 14, -110); x.quadraticCurveTo(d * 32, -112, d * 27, -136); x.quadraticCurveTo(d * 22, -120, d * 11, -116); x.fill(); });
  } else { // Luffy : gilet rouge, short bleu, sandales, cicatrice, chapeau de paille
    R(skin, -16, -26, 13, 26); R(skin, 3, -26, 13, 26);
    R('#8d6e63', -18, -5, 17, 5); R('#8d6e63', 1, -5, 17, 5);
    R('#3b6fd8', -22, -48, 44, 24);
    R(skin, -22, -90, 44, 42);
    R('#e74c3c', -22, -90, 13, 42); R('#e74c3c', 9, -90, 13, 42);
    C(skin, 0, -102, 14);
    R('#000', s * 6 - 2, -104, 4, 4);
    LN('#c0392b', 1.5, s * 4, -97, s * 11, -97);
    x.fillStyle = P('#f1c40f'); x.beginPath(); x.ellipse(0, -113, 25, 6, 0, 0, 7); x.fill();
    x.beginPath(); x.arc(0, -113, 13, Math.PI, 0); x.fill();
    R('#c0392b', -13, -119, 26, 4);
  }
  // bras, mains, sceptre
  const hand = (px, py) => {
    if (n === 'Bruno') { C('#e74c3c', px, py, 11); C('#ff7675', px - 3, py - 3, 3); }
    else if (n === 'Kaze') { C(skin, px, py, 6); if (f.ak === 0 || f.ak === 3) LN('#ecf0f1', 3, px, py, px + s * 28, py); }
    else if (n === 'Titan') { C('#7f8c8d', px, py, 12); C('#95a5a6', px - 3, py - 3, 4); }
    else C(skin, px, py, 10);
  };
  const sleeve = n === 'Kaze' ? '#1c1c28' : skin;
  if (n === 'Zéphyr') {
    if (f.ak === 3) { LN('#8d6e63', 4, s * 30, -2, s * 30, -140); C('#f1c40f', s * 30, -146, 14); }
    else if (f.ak >= 0) {
      const e = f.ap === 1 ? 34 : f.ap === 0 ? 8 : 20;
      LN('#8d6e63', 4, s * 8, -62, s * (e + 18), -66);
      C('#5dade2', s * (e + 22), -66, f.ap === 1 ? 12 : 8);
    } else {
      LN('#8d6e63', 4, s * 30, -2, s * 30, -128);
      C('#5dade2', s * 30, -133, 7); C('#d6eaf8', s * 28, -135, 2.5);
    }
  } else if (f.ak >= 0) {
    let Lx = f.ap === 1 ? 62 : f.ap === 0 ? 12 : 37;
    if (f.b && n === 'Luffy') Lx = Math.max(Lx, s > 0 ? f.b[1] - f.x : f.x - f.b[0]);
    LN(sleeve, n === 'Luffy' ? 7 : 9, 0, -65, s * Lx, -65);
    hand(s * Lx, -65);
  } else if (n === 'Bruno') { LN(skin, 8, 0, -68, s * 14, -76); hand(s * 18, -78); }
  else hand(s * 24, -50);
  if (f.bl) { x.fillStyle = 'rgba(120,200,255,.6)'; x.fillRect(s * 24 - 5, -95, 10, 85); }
  x.restore();
  if (f.b) { x.fillStyle = 'rgba(255,255,255,.3)'; x.fillRect(f.b[0], f.b[2], f.b[1] - f.b[0], f.b[3] - f.b[2]); }
  if (i === me) { x.fillStyle = '#fff'; x.font = '12px sans-serif'; x.textAlign = 'center'; x.fillText('▼ TOI', f.x, f.y - 168); }
}

function hud() {
  S.f.forEach((f, i) => {
    const c = chars[f.c], w = 380, xx = i ? 900 - 20 - w : 20, pw = w * f.hp / c.hp, uw = w * f.ul / 100, rdy = f.ul >= 100;
    x.fillStyle = '#000'; x.fillRect(xx, 20, w, 22);
    x.fillStyle = c.color; x.fillRect(i ? xx + w - pw : xx, 20, pw, 22);
    x.fillStyle = '#000'; x.fillRect(xx, 46, w, 9);
    x.fillStyle = rdy && ((Date.now() / 150) | 0) % 2 ? '#fff' : '#f1c40f'; x.fillRect(i ? xx + w - uw : xx, 46, uw, 9);
    x.fillStyle = '#fff'; x.font = 'bold 14px sans-serif'; x.textAlign = i ? 'right' : 'left';
    x.fillText(c.name + (i === me ? ' (toi)' : ''), i ? xx + w : xx, 74);
    if (rdy) { x.fillStyle = '#f1c40f'; x.textAlign = i ? 'left' : 'right'; x.fillText(i === me ? '⚡ ULTIME PRÊT : U' : '⚡ ULTIME PRÊT', i ? xx : xx + w, 74); }
    for (let k = 0; k < 2; k++) {
      x.fillStyle = k < S.w[i] ? '#f1c40f' : '#555'; x.beginPath();
      x.arc(i ? xx + w - 8 - k * 20 : xx + 8 + k * 20, 90, 6, 0, 7); x.fill();
    }
  });
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = 'bold 28px sans-serif'; x.fillText(fmt(S.tm), 450, 42);
  const t = S.p === 'cd' ? S.n : (S.p === 'rend' || S.p === 'end') ? S.m : '';
  x.font = 'bold 44px sans-serif'; x.lineWidth = 5; x.strokeStyle = '#000'; x.strokeText(t, 450, 210); x.fillText(t, 450, 210);
}

function draw() {
  const g = x.createLinearGradient(0, 0, 0, 450); g.addColorStop(0, '#1b2a49'); g.addColorStop(1, '#3b2a4a');
  x.fillStyle = g; x.fillRect(0, 0, 900, 450);
  x.fillStyle = '#2c2c3a'; x.fillRect(0, 380, 900, 70);
  if (S && S.f.length) {
    S.fx.forEach(e => {
      if (e.p) {
        x.fillStyle = 'rgba(120,160,255,.6)'; x.fillRect(e.x - 40, 0, 80, 380);
        x.fillStyle = 'rgba(255,255,210,.95)'; x.fillRect(e.x - 18, 0, 36, 380);
      } else {
        x.fillStyle = 'rgba(255,60,60,.15)'; x.fillRect(e.x - 45, 0, 90, 380);
        x.fillStyle = 'rgba(255,60,60,.55)'; x.beginPath(); x.ellipse(e.x, 380, 45, 8, 0, 0, 7); x.fill();
      }
    });
    S.f.forEach(fighter);
    S.pj.forEach(p => { x.fillStyle = chars[S.f[p.o].c].color; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 2; x.stroke(); });
    hud();
  }
  requestAnimationFrame(draw);
}
ui(); draw();
</script></body></html>
