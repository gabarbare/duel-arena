
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Arena</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;align-items:center}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;background:#222}
#ov{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);text-align:center;padding:10px;box-sizing:border-box}

/* Amélioration de l'écran de sélection */
#ov.select{
	justify-content:flex-start;
	padding:14px 12px;
	overflow-y:auto;
}
#ov.select .cards{
	display:grid;
	grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
	gap:8px;
	width:min(100%,780px);
	max-height:285px;
	overflow-y:auto;
	align-content:start;
	padding:4px;
	box-sizing:border-box;
}
#ov.select .card{
	width:auto;
	min-width:0;
	font-size:12px;
}
@media(max-width:600px){
	#ov.select{
		padding:8px 6px;
		gap:6px;
	}
	#ov.select .cards{
		grid-template-columns:repeat(auto-fit,minmax(115px,1fr));
		max-height:260px;
	}
	#ov.select .card{
		font-size:11px;
	}
}

button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}
button{background:#3498db;color:#fff;cursor:pointer}
input{text-transform:uppercase;width:90px;text-align:center}
.cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card{background:#222;border:3px solid #444;border-radius:10px;padding:6px;width:92px;cursor:pointer;font-size:11px;text-align:left;line-height:1.5}
.card.sel{background:#444}
#ov.end{background:rgba(0,0,0,.4);justify-content:flex-end;padding-bottom:24px}
.card.lock{opacity:.45}
.chip{display:inline-block;margin:3px 2px 0 0;padding:1px 7px;border-radius:9px;background:#555;font-size:11px}
.chip.on{background:#3498db}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="wrap">
	<canvas id="c" width="900" height="600"></canvas>
	<div id="ov"></div>
</div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d'), ov = document.getElementById('ov');
let ws, me = -1, chars = [], S = null, code = '', err = '', last = '';
const keys = {};

// ====== CATALOGUE de la boutique (4 articles au hasard par jour et par joueur ; pour en ajouter, copie une ligne) ======
// type 'skin' : change les couleurs d'un perso ('pal' = { couleur d'origine : nouvelle couleur })
// type 'char' : verrouille un perso tant qu'il n'est pas acheté
const SHOP = [
  { id: 'perso_luffy', type: 'char', char: 'Luffy', name: 'Luffy', price: 200, desc: 'One Piece : coups élastiques, Gear Second' },
  { id: 'perso_naruto', type: 'char', char: 'Naruto', name: 'Naruto', price: 200, desc: 'Naruto : clones, Rasengan, Rasenshuriken' },
  { id: 'perso_gojo', type: 'char', char: 'Gojo', name: 'Gojo Satoru', price: 300, desc: 'Jujutsu Kaisen : sphères Rouge et Bleu, soin, Infini' },
  { id: 'perso_deku', type: 'char', char: 'Deku', name: 'Izuku Midoriya', price: 250, desc: 'My Hero Academia : One For All, Air Force, Detroit Smash' },
  { id: 'perso_denji', type: 'char', char: 'Denji', name: 'Denji', price: 300, desc: 'Chainsaw Man : Pochita, recul, transformation' },
  { id: 'perso_yugo', type: 'char', char: 'Yugo', name: 'Yugo', price: 300, desc: 'Wakfu : laser, téléportation, portails éliatropes' },
  { id: 'perso_shinra', type: 'char', char: 'Shinra', name: 'Shinra', price: 400, desc: 'Fire Force : vol, coups de pied enflammés, vitesse lumière' },
  { id: 'perso_eren', type: 'char', char: 'Eren', name: 'Eren Yeager', price: 400, desc: "L'Attaque des Titans : grappins, Titan Assaillant" },
  { id: 'perso_koro', type: 'char', char: 'Koro', name: 'Koro-sensei', price: 200, desc: 'Assassination Classroom : tentacules, Mach 20' },
  { id: 'skin_kaze_or', type: 'skin', char: 'Kaze', name: 'Kaze doré', price: 60, pal: { '#1c1c28': '#c9a227', '#2ecc71': '#fff4c2' } },
  { id: 'skin_bruno_bleu', type: 'skin', char: 'Bruno', name: 'Bruno bleu', price: 60, pal: { '#e74c3c': '#3498db', '#ff7675': '#74b9ff' } },
  { id: 'skin_zephyr_blanc', type: 'skin', char: 'Zéphyr', name: 'Zéphyr blanc', price: 60, pal: { '#6c3483': '#f2f4f6', '#5b2c6f': '#dfe6e9', '#4a235a': '#b2bec3', '#ecf0f1': '#b0b8bf' } },
  { id: 'skin_chevalier_noir', type: 'skin', char: 'Chevalier', name: 'Chevalier noir', price: 60, pal: { '#b0bec5': '#2b2b33', '#cfd8dc': '#454550', '#78909c': '#1c1c24', '#455a64': '#111118', '#90a4ae': '#55555f', '#2c5fa8': '#22222b' } },
  { id: 'skin_viking_rouge', type: 'skin', char: 'Viking', name: 'Viking rouge', price: 60, pal: { '#6d4c41': '#c0392b', '#4e342e': '#7b241c', '#d35400': '#e67e22', '#3e2723': '#4a1410' } },
];
let save = { coins: 0, owned: [], skin: {}, daily: null, stats: { played: 0, wins: 0, losses: 0, byChar: {} } }, view = 'menu', earned = 0, paid = 0, maps = [], searching = false, infoIdx = null;
if (!save.stats || typeof save.stats !== 'object') save.stats = { played: 0, wins: 0, losses: 0, byChar: {} };
if (!save.stats.byChar || typeof save.stats.byChar !== 'object') save.stats.byChar = {};
save.stats.played = Number(save.stats.played) || 0;
save.stats.wins = Number(save.stats.wins) || 0;
save.stats.losses = Number(save.stats.losses) || 0;
try { Object.assign(save, JSON.parse(localStorage.getItem('duelArena') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('duelArena', JSON.stringify(save)); } catch (e) {} };
const owns = id => save.owned.includes(id);
const locked = name => SHOP.some(q => q.type === 'char' && q.char === name && !owns(q.id));
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
// boutique du jour : 4 articles tirés au hasard (persos et skins mélangés) parmi ce que le joueur ne possède pas, renouvelés à minuit
function dailyIds() {
  const key = dayKey();
  if (!save.daily || save.daily.day !== key) {
    const pool = SHOP.filter(q => !owns(q.id)).map(q => q.id);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    save.daily = { day: key, ids: pool.slice(0, 4) }; persist();
  }
  return save.daily.ids;
}
function buy(id) {
  const q = SHOP.find(z => z.id === id);
  if (!q || owns(id) || !dailyIds().includes(id) || save.coins < q.price) return;
  save.coins -= q.price; save.owned.push(id); persist(); ui();
}

function connect(first) {
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => w.send(JSON.stringify(first));
  w.onmessage = e => {
    if (w !== ws) return;
    const m = JSON.parse(e.data);
    if (m.t === 'chars') { chars = m.chars; view = 'training'; ui(); }
    else if (m.t === 'room') { me = m.idx; chars = m.chars; maps = m.maps; code = m.code; searching = false; }
    else if (m.t === 'err') { err = m.m; me = -1; S = null; searching = false; w.close(); }
    else if (m.t === 's') {
      S = m;
      if (m.p === 'end' && m.co) {
        if (!paid) {
          paid = 1;
          earned = m.co[me];
          save.coins += earned;
          const charIndex = m.f && m.f[me] ? m.f[me].c : null;
          const charName = charIndex != null && chars[charIndex] ? chars[charIndex].name : 'Inconnu';
          const won = Number(m.winner) === me;
          save.stats.played++;
          if (won) save.stats.wins++; else save.stats.losses++;
          if (!save.stats.byChar[charName]) save.stats.byChar[charName] = { played: 0, wins: 0, losses: 0 };
          const cs = save.stats.byChar[charName];
          cs.played++;
          if (won) cs.wins++; else cs.losses++;
          persist();
        }
      } else paid = 0;
    }
    ui();
  };
  w.onclose = () => { if (w === ws && me >= 0) { err = 'Connexion perdue'; me = -1; S = null; ui(); } };
}
const go = o => { err = ''; connect(o); };
const search = () => { err = ''; searching = true; connect({ t: 'queue' }); ui(); };
function openTraining() {
  view = 'training';
  if (!chars.length || !ws || ws.readyState !== 1) connect({ t: 'training_list' });
  else ui();
}
function startTraining(i) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'train', c: i, sk: save.skin[chars[i].name] || '' }));
}
const pick = i => { infoIdx = i; if (locked(chars[i].name)) { ui(); return; } ws.send(JSON.stringify({ t: 'pick', c: i, sk: save.skin[chars[i].name] || '' })); ui(); };
const again = () => ws.send(JSON.stringify({ t: 'again' }));
const startRoom = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'start' })); };
function leave() { me = -1; S = null; err = ''; view = 'menu'; searching = false; try { ws.close(); } catch (e) {} ui(); }
function info(i) { if (infoIdx !== i) { infoIdx = i; ui(); } }
function setSkin(name, id, i) { save.skin[name] = id; persist(); if (S && S.p === 'select' && S.sel[me] === i) pick(i); ui(); }

const shopHtml = () => {
  const items = dailyIds().map(id => SHOP.find(q => q.id === id)).filter(Boolean);
  const left = new Date().setHours(24, 0, 0, 0) - Date.now(), hh = Math.floor(left / 3600000), mm = Math.floor(left % 3600000 / 60000);
  return `<h2>🛒 Boutique du jour</h2><p>🪙 ${save.coins} pièces · nouvelle sélection à minuit (dans ${hh} h ${mm} min)</p>` + (items.length
    ? `<div class="cards">${items.map(q => `<div class="card shopc"><b>${q.name}</b><br>${q.type === 'skin' ? 'Skin · ' + q.char : 'Personnage'}<br>${q.desc || ''}<br>${owns(q.id) ? '✓ Possédé' : `<button ${save.coins < q.price ? 'disabled' : ''} onclick="buy('${q.id}')">${q.price} 🪙</button>`}</div>`).join('')}</div>`
    : '<p>Tu possèdes déjà tout ce que la boutique propose 🎉</p>') + `<button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;
};
function statsHtml() {
  const s = save.stats;
  const top = Object.entries(s.byChar)
    .sort((a, b) => (b[1].played || 0) - (a[1].played || 0))
    .slice(0, 3);
  const rate = (w, p) => p ? Math.round(w / p * 100) : 0;
  const cards = top.length ? top.map(([name, v], i) => {
    const ch = chars.find(c => c.name === name);
    const color = ch ? ch.color : '#3498db';
    return `<div class="card" style="width:190px;border-color:${color};cursor:default">
      <b style="color:${color}">#${i + 1} ${name}</b><br>
      🎮 Parties : ${v.played || 0}<br>
      🏆 Victoires : ${v.wins || 0}<br>
      ❌ Défaites : ${v.losses || 0}<br>
      📈 Winrate : ${rate(v.wins || 0, v.played || 0)}%
    </div>`;
  }).join('') : '<p>Aucune partie terminée pour le moment. Joue un match pour commencer à remplir tes statistiques !</p>';
  return `<h2>📊 Statistiques</h2>
    <p>Statistiques enregistrées sur cet appareil</p>
    <div class="cards">
      <div class="card" style="width:145px;cursor:default"><b>🎮 Parties jouées</b><br>${s.played}</div>
      <div class="card" style="width:145px;cursor:default"><b>🏆 Victoires</b><br>${s.wins}</div>
      <div class="card" style="width:145px;cursor:default"><b>❌ Défaites</b><br>${s.losses}</div>
      <div class="card" style="width:145px;cursor:default"><b>📈 Winrate global</b><br>${rate(s.wins, s.played)}%</div>
    </div>
    <h3>⭐ Tes 3 personnages les plus joués</h3>
    <div class="cards">${cards}</div>
    <button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>`;
}
const quitBtn = '<button onclick="leave()" style="background:#7f8c8d">Retour au menu</button>';

function ui() {
  let h = '';
  ov.className = me >= 0 && S && S.p === 'end' ? 'end' : '';
  if (me < 0 && searching) h = `<h2>🔎 Recherche d’un adversaire…</h2><p>Tu seras mis face à un joueur aléatoire.</p>${quitBtn.replace('Retour au menu', 'Annuler')}`;
  else if (me < 0) h = view === 'stats' ? statsHtml() : view === 'training' ? `<h2>🎯 Mode entraînement</h2><p>Choisis librement ton personnage : tous les personnages sont disponibles.</p><div class="cards">${chars.map((ch, i) => `<div class="card" style="border-color:${ch.color}" onclick="startTraining(${i})"><b style="color:${ch.color}">${ch.name}</b><br>${ch.desc}<br>PV : ${ch.hp}<br>${ch.atk.map((a,j) => 'JKLU'[j] + ' : ' + a).join('<br>')}</div>`).join('')}</div><button onclick="view='menu';ui()" style="background:#7f8c8d">← Menu</button>` : view === 'shop' ? shopHtml() : `<h1>⚔️ Duel Arena</h1><p>🪙 ${save.coins} pièces</p>${err ? `<p style="color:#f66">${err}</p>` : ''}
    <button onclick="search()" style="background:#e67e22">🎲 Matchmaking (adversaire aléatoire)</button>
    <button onclick="go({t:'create'})">Créer une partie multijoueur</button>
    <button onclick="go({t:'bot'})" style="background:#16a085">🤖 Jouer contre un bot</button>
    <div>ou <input id="cd" maxlength="4" placeholder="CODE" value="${location.hash.slice(1)}"> <button onclick="go({t:'join',code:document.getElementById('cd').value})">Rejoindre</button></div>
    <button onclick="openTraining()" style="background:#16a085">🎯 Mode entraînement</button>
    <button onclick="view='stats';ui()" style="background:#2980b9">📊 Statistiques</button>
    <button onclick="view='shop';ui()" style="background:#8e44ad">🛒 Boutique</button>`;
  else if (!S || S.p === 'wait') h = `<h2>⚔️ Salon multijoueur</h2><p>Joueurs : ${S && S.count || 1} / 4</p><p>Code : <b style="font-size:34px">${code}</b></p><p>Envoie ce lien à tes amis :<br><b>${location.origin}/#${code}</b></p>${S && S.count >= 2 && me === 0 ? '<button onclick="startRoom()">Commencer la partie</button>' : S && S.count >= 2 ? '<p>En attente du lancement par l’hôte…</p>' : '<p>En attente d’au moins un autre joueur…</p>'}${quitBtn}`;
  else if (S.p === 'select') {
    const ii = infoIdx != null ? infoIdx : (S.sel[me] != null ? S.sel[me] : 0), ic = chars[ii];
    const sks = SHOP.filter(q => q.type === 'skin' && q.char === ic.name && owns(q.id)), cur = save.skin[ic.name] || '';
    h = `<h2 style="margin:2px">Choisis ton combattant</h2><div class="cards">${chars.map((c, i) => `<div class="card sm ${S.sel[me] === i ? 'sel' : ''} ${locked(c.name) ? 'lock' : ''}" style="border-color:${c.color}" onclick="pick(${i})" onmouseenter="info(${i})"><b style="color:${c.color}">${c.name}</b>${locked(c.name) ? '<br>🔒' : ''}</div>`).join('')}</div>
    <div class="panel"><b style="color:${ic.color};font-size:15px">${ic.name}</b>${locked(ic.name) ? ' 🔒 à débloquer dans la boutique' : ''} · ${ic.desc} · PV ${ic.hp}<br>${ic.atk.map((a, j) => 'JKLU'[j] + ' : ' + a).join(' &nbsp;·&nbsp; ')}${ic.alt ? '<br>✨ Forme : ' + ic.alt.join(' / ') : ''}${sks.length ? '<br>' + [{ id: '', name: 'Normal' }, ...sks].map(q => `<span class="chip ${cur === q.id ? 'on' : ''}" onclick="event.stopPropagation();setSkin('${ic.name}','${q.id}',${ii})">${q.name}</span>`).join('') : ''}</div>
    <p style="margin:2px">${S.sel[me] != null ? 'Tu es prêt ✔' : 'Choisis ton personnage'} · Joueurs prêts : ${S.sel.filter(v=>v!=null).length}/${S.sel.length}</p>
    <p style="font-size:12px;opacity:.8;margin:2px">Flèches ou ZQSD : bouger, sauter (haut), bloquer (bas) · J K L : attaques · U ou Espace : ultime (barre pleine)</p>${quitBtn}`;
  }
  else if (S.p === 'training') { ov.style.display = 'none'; last = ''; return; }
  else if (S.p === 'end') h = `<p style="font-size:18px">🪙 +${earned} pièces (total : ${save.coins})</p>${S.ag[me] ? '<p>En attente de l’adversaire…</p>' : '<button onclick="again()">⚔️ Revanche</button>'} ${quitBtn}`;
  else { ov.style.display = 'none'; last = ''; return; }
  if (h !== last) { ov.innerHTML = h; last = h; }
  ov.style.display = 'flex';
}

const map = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', KeyJ: 0, KeyK: 1, KeyL: 2, KeyU: 3, Space: 3 };
function key(e) {
  if (S && S.p === 'training' && e.type === 'keydown') {
    if (e.code === 'KeyR') { e.preventDefault(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'training_reset' })); return; }
    if (e.code === 'Escape') { e.preventDefault(); leave(); return; }
  }
  const k = map[e.code];
  if (k === undefined || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  const v = e.type === 'keydown';
  if (!!keys[k] !== v) {
    keys[k] = v;
    if (ws && ws.readyState === 1 && me >= 0) ws.send(JSON.stringify({ t: 'in', l: keys.l, r: keys.r, u: keys.u, d: keys.d, a: [keys[0], keys[1], keys[2], keys[3]] }));
  }
}
addEventListener('keydown', key); addEventListener('keyup', key);

const fmt = t => Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');

let FL = 0;
let PAL = null;
const P = v => FL ? '#fff' : (PAL && PAL[v]) || v;
const R = (v, a, b, w, h) => { x.fillStyle = P(v); x.fillRect(a, b, w, h); };
const C = (v, a, b, r) => { x.fillStyle = P(v); x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); };
const Y = (v, pts) => { x.fillStyle = P(v); x.beginPath(); pts.forEach((p, j) => j ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); };
const LN = (v, w, a, b, c2, d) => { x.strokeStyle = P(v); x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); };

const rasen = (px, py, r, bl) => {
  x.fillStyle = 'rgba(93,173,226,.9)'; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  x.strokeStyle = '#ecf0f1'; x.lineWidth = 2; const a = Date.now() / 60;
  for (let q = 0; q < 3; q++) { x.beginPath(); x.arc(px, py, r * (.35 + q * .22), a + q * 2, a + q * 2 + 3); x.stroke(); }
  if (bl) for (let q = 0; q < 4; q++) { const g = a / 3 + q * Math.PI / 2; Y('#ecf0f1', [[px + Math.cos(g) * r, py + Math.sin(g) * r], [px + Math.cos(g + .3) * r * 1.6, py + Math.sin(g + .3) * r * 1.6], [px + Math.cos(g + .6) * r, py + Math.sin(g + .6) * r]]); }
};
const orb = (px, py, r, col, core) => {
  x.fillStyle = col; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  x.fillStyle = core; x.beginPath(); x.arc(px, py, r * .5, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 2; const a = Date.now() / 80;
  x.beginPath(); x.arc(px, py, r * 1.3, a, a + 2.2); x.stroke();
};
const shield = (px, py, z) => {
  const pts = m => [[-12 * m, -22 * m], [12 * m, -22 * m], [12 * m, 6 * m], [0, 24 * m], [-12 * m, 6 * m]].map(q => [px + q[0] * z, py + q[1] * z]);
  Y('#f1c40f', pts(1)); Y('#2c5fa8', pts(.8));
  R('#f1c40f', px - 1.5 * z, py - 17 * z, 3 * z, 34 * z); R('#f1c40f', px - 9 * z, py - 6 * z, 18 * z, 3 * z);
};
const sword = (hx, hy, tx, ty, col) => {
  const dx = tx - hx, dy = ty - hy;
  LN(col || '#dfe6e9', 5, hx, hy, tx, ty); LN('#f1c40f', 4, hx + dy * .15, hy - dx * .15, hx - dy * .15, hy + dx * .15);
};

function fighter(f, i) {
  const c = chars[f.c], s = f.fc, n = c.name, t = Date.now();
  FL = f.fl;
  const sd = f.sk && SHOP.find(q => q.id === f.sk); PAL = sd && sd.pal || null;
  x.save(); x.translate(f.x, f.y);
  if (f.iv) x.globalAlpha = .45;
  if (f.out) x.globalAlpha = .25;
  if (f.sz > 1) x.scale(f.sz, f.sz);
  const gn = n === 'Gojo', dk = n === 'Deku';
  if (f.ak === 3 || f.bf || (gn && f.ak === 2) || (n === 'Denji' && f.fm) || (n === 'Shinra' && f.fm)) {
    x.fillStyle = gn && f.ak === 2 ? 'rgba(120,255,170,.3)' : f.ak === 3 ? 'rgba(255,230,80,.35)' : n === 'Shinra' ? 'rgba(255,240,170,.3)' : dk ? 'rgba(90,255,120,.28)' : 'rgba(255,90,90,.3)';
    x.beginPath(); x.arc(0, -55, 75, 0, 7); x.fill();
